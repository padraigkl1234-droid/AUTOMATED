name: Scheduled posts

# Four slots a day, matching config/schedule.yaml. Times are UTC.
#
# GitHub's scheduled runs are best-effort and routinely start 5-15 minutes
# late under load -- fine for a news account, but do not use this to hit an
# exact minute. If you need precision, move to a small always-on host and
# run the same CLI from cron.
on:
  schedule:
    - cron: "0 7 * * *"    # morning_roundup
    - cron: "0 12 * * *"   # midday_talking_point
    - cron: "0 17 * * *"   # evening_news
    - cron: "0 22 * * *"   # night_results
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run"
        required: true
        default: "evening_news"
        type: choice
        options: [morning_roundup, midday_talking_point, evening_news, night_results]
      dry_run:
        description: "Render only, do not queue or publish"
        type: boolean
        default: true

concurrency:
  # Two slots must never publish at once -- they would both read the same
  # ledger and could pick the same story.
  group: football-social-publish
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the ledger back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Resolve slot from cron schedule
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 * * *")  echo "id=morning_roundup"      >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *") echo "id=midday_talking_point" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * *") echo "id=evening_news"         >> "$GITHUB_OUTPUT" ;;
            "0 22 * * *") echo "id=night_results"        >> "$GITHUB_OUTPUT" ;;
            *)            echo "id=${{ inputs.slot || 'evening_news' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run slot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
          # Start on 'drafts'. Only set the PUBLISH_MODE variable to 'auto'
          # once you have watched the queue for a couple of weeks.
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'drafts' }}
          PYTHONPATH: src
        run: |
          python -m football_social run "${{ steps.slot.outputs.id }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload rendered media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ steps.slot.outputs.id }}-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Persist ledger and post history
        # The ledger is what stops the same story going out twice. Runners are
        # ephemeral, so it has to be committed back or every run starts blind.
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "football-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ || true
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update posting state [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && \
                git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push failed, retry $i"; sleep $((2 ** i))
            done
          fi
